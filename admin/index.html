<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UniBridge Back Office</title>
<style>
  :root { --blue:#2D5BFF; --green:#21C063; --ink:#101828; --faint:#667085; --line:#E4E7EC; --bg:#F8FAFC; --danger:#D92D20; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.5 -apple-system,'Segoe UI',Roboto,sans-serif; color:var(--ink); background:var(--bg); }
  header { display:flex; align-items:center; gap:12px; padding:14px 20px; background:#fff; border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5; }
  header .logo { font-weight:800; font-size:17px; }
  header .logo b { color:var(--blue); } header .logo i { color:var(--green); font-style:normal; }
  header .tag { color:var(--faint); font-size:12px; }
  header .spacer { flex:1; }
  main { max-width:1080px; margin:0 auto; padding:20px; }
  nav { display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap; }
  nav button { border:1px solid var(--line); background:#fff; border-radius:20px; padding:7px 16px; cursor:pointer; font-weight:600; color:var(--faint); }
  nav button.on { background:var(--blue); border-color:var(--blue); color:#fff; }
  .card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:16px; }
  h2 { font-size:15px; margin:0 0 10px; } .sub { color:var(--faint); font-size:12px; margin:-6px 0 12px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th { text-align:left; color:var(--faint); font-weight:600; padding:6px 8px; border-bottom:1px solid var(--line); white-space:nowrap; }
  td { padding:7px 8px; border-bottom:1px solid var(--line); vertical-align:middle; }
  tr:last-child td { border-bottom:none; }
  .pill { display:inline-block; padding:2px 9px; border-radius:12px; font-size:11px; font-weight:700; background:#EFF4FF; color:var(--blue); }
  .pill.green { background:#ECFDF3; color:#067647; } .pill.gray { background:#F2F4F7; color:var(--faint); }
  button.act { border:1px solid var(--line); background:#fff; border-radius:8px; padding:5px 10px; cursor:pointer; font-weight:600; }
  button.act:hover { border-color:var(--blue); color:var(--blue); }
  button.primary { background:var(--blue); border-color:var(--blue); color:#fff; }
  button.danger:hover { border-color:var(--danger); color:var(--danger); }
  select,input { border:1px solid var(--line); border-radius:8px; padding:6px 9px; font:inherit; background:#fff; }
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; }
  .stat { background:#fff; border:1px solid var(--line); border-radius:12px; padding:14px; }
  .stat .n { font-size:24px; font-weight:800; color:var(--blue); } .stat .l { color:var(--faint); font-size:12px; }
  #auth { max-width:360px; margin:8vh auto; }
  #auth input { width:100%; margin-bottom:10px; padding:10px; }
  #auth button { width:100%; padding:10px; margin-bottom:8px; border-radius:8px; }
  .note { font-size:12px; color:var(--faint); }
  .err { color:var(--danger); font-size:13px; margin:8px 0; min-height:18px; }
  .okmsg { color:#067647; font-size:13px; margin:8px 0; }
  .scroll { overflow-x:auto; }
  .muted { color:var(--faint); }
  footer { text-align:center; color:var(--faint); font-size:11px; padding:20px; }
</style>
</head>
<body>
<header>
  <div class="logo"><b>Uni</b><i>Bridge</i></div>
  <div class="tag">Back Office</div>
  <div class="spacer"></div>
  <span id="who" class="note"></span>
  <button id="setpass" class="act" style="display:none">Set password</button>
  <button id="signout" class="act" style="display:none">Sign out</button>
</header>
<main id="main"></main>
<footer>UniBridge Back Office — admin access only. All actions run under your account's audited permissions.</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="./config.js"></script>
<script>
const $ = (s) => document.querySelector(s);
// <template> parses ANY fragment correctly — a plain div silently drops
// <tr>/<td> (they're only valid inside a table), which blanked every list.
const el = (html) => { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstChild; };
const esc = (v) => String(v ?? '').replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const main = $('#main');

if (!window.UB_CONFIG || !window.UB_CONFIG.url) {
  main.innerHTML = '<div class="card"><h2>Not configured</h2><p class="note">config.js is generated when the supabase-deploy pipeline publishes this page. Run the deployment first.</p></div>';
  throw new Error('no config');
}
const db = window.supabase.createClient(window.UB_CONFIG.url, window.UB_CONFIG.anonKey);
const STATUSES = ['submitted','under_review','conditional_offer','offer','accepted','coe_issued'];
/** Never render a failed query as an empty list — say what went wrong. */
const stateRow = (tb, cols, error, emptyText) =>
  tb.appendChild(el(`<tr><td colspan="${cols}" class="${error ? 'err' : 'muted'}">${
    error ? 'Could not load: ' + esc(error.message) : emptyText}</td></tr>`));

// ------------------------------------------------------------------- auth
async function boot() {
  const { data: { session } } = await db.auth.getSession();
  if (!session) return renderAuth();
  // Invite / recovery links land here with a session but no password set yet.
  const hashType = new URLSearchParams(location.hash.slice(1)).get('type');
  if (hashType === 'invite' || hashType === 'recovery') return renderSetPassword();
  const { data: adminRow } = await db.from('admin_users').select('role').maybeSingle();
  if (!adminRow) {
    main.innerHTML = '<div class="card"><h2>No access</h2><p class="note">This account is signed in but has no back-office permission. Ask the owner to grant it.</p></div>';
    $('#signout').style.display = '';
    return;
  }
  $('#who').textContent = session.user.email;
  $('#signout').style.display = '';
  $('#setpass').style.display = '';
  $('#setpass').onclick = () => renderSetPassword();
  renderShell();
}

function renderAuth() {
  main.innerHTML = '';
  main.appendChild(el(`<div id="auth" class="card">
    <h2>Admin sign-in</h2>
    <div class="err" id="aerr"></div>
    <input id="email" type="email" placeholder="Email" autocomplete="username">
    <input id="pass" type="password" placeholder="Password" autocomplete="current-password">
    <button class="primary act" id="login">Sign in</button>
    <button class="act" id="magic">Email me a sign-in link</button>
    <p class="note">First time here? Open the invitation email we sent you — it signs you in to set a password.</p>
  </div>`));
  $('#login').onclick = async () => {
    const { error } = await db.auth.signInWithPassword({ email: $('#email').value.trim(), password: $('#pass').value });
    if (error) { $('#aerr').textContent = error.message; return; }
    location.hash = ''; boot();
  };
  $('#magic').onclick = async () => {
    const email = $('#email').value.trim();
    if (!email) { $('#aerr').textContent = 'Type your email first.'; return; }
    const { error } = await db.auth.signInWithOtp({ email, options: { emailRedirectTo: location.origin + location.pathname } });
    $('#aerr').textContent = error ? error.message : 'Link sent — check your inbox.';
  };
}

function renderSetPassword() {
  main.innerHTML = '';
  const fromInvite = /type=(invite|recovery)/.test(location.hash);
  main.appendChild(el(`<div id="auth" class="card">
    ${fromInvite ? '' : '<button class="act" id="pwback" style="margin-bottom:10px">← Back</button>'}
    <h2>Welcome — set your password</h2>
    <div class="err" id="perr"></div>
    <input id="np1" type="password" placeholder="New password (min 8 characters)" autocomplete="new-password">
    <input id="np2" type="password" placeholder="Repeat password" autocomplete="new-password">
    <button class="primary act" id="setp">Save password & enter</button>
  </div>`));
  const pwback = $('#pwback');
  if (pwback) pwback.onclick = () => { history.replaceState(null, '', location.pathname); boot(); };
  $('#setp').onclick = async () => {
    const p1 = $('#np1').value, p2 = $('#np2').value;
    if (p1.length < 8) { $('#perr').textContent = 'Use at least 8 characters.'; return; }
    if (p1 !== p2) { $('#perr').textContent = 'Passwords do not match.'; return; }
    const { error } = await db.auth.updateUser({ password: p1 });
    if (error) { $('#perr').textContent = error.message; return; }
    history.replaceState(null, '', location.pathname);
    boot();
  };
}

$('#signout').onclick = async () => { await db.auth.signOut(); location.reload(); };

// ------------------------------------------------------------------ shell
const TABS = ['Overview','Students','Applications','Rewards','Community','Catalog'];
let tab = 'Overview';
function renderShell() {
  main.innerHTML = '';
  const nav = el('<nav></nav>');
  for (const t of TABS) {
    const b = el(`<button class="${t === tab ? 'on' : ''}">${t}</button>`);
    b.onclick = () => { tab = t; renderShell(); };
    nav.appendChild(b);
  }
  main.appendChild(nav);
  const body = el('<div id="body"><div class="card muted">Loading…</div></div>');
  main.appendChild(body);
  ({ Overview: vOverview, Students: vStudents, Applications: vApplications,
     Rewards: vRewards, Community: vCommunity, Catalog: vCatalog })[tab](body);
}

// --------------------------------------------------------------- overview
async function vOverview(body) {
  const [students, apps, coins, red] = await Promise.all([
    db.from('profiles').select('id', { count: 'exact', head: true }),
    db.from('applications').select('status'),
    db.from('coin_ledger').select('delta'),
    db.from('redemptions').select('fulfilled'),
  ]);
  const byStatus = {};
  for (const a of apps.data ?? []) byStatus[a.status] = (byStatus[a.status] ?? 0) + 1;
  const balance = (coins.data ?? []).reduce((s, r) => s + r.delta, 0);
  const pending = (red.data ?? []).filter((r) => !r.fulfilled).length;
  body.innerHTML = '';
  body.appendChild(el(`<div class="stats">
    <div class="stat"><div class="n">${students.count ?? 0}</div><div class="l">Registered students</div></div>
    <div class="stat"><div class="n">${(apps.data ?? []).length}</div><div class="l">Applications</div></div>
    <div class="stat"><div class="n">${balance}</div><div class="l">Coins outstanding</div></div>
    <div class="stat"><div class="n">${pending}</div><div class="l">Redemptions to fulfil</div></div>
  </div>`));
  body.appendChild(el(`<div class="card"><h2>Applications by stage</h2>
    ${STATUSES.map((s) => `<span class="pill" style="margin:0 6px 6px 0">${s.replace('_',' ')} · ${byStatus[s] ?? 0}</span>`).join('')}
  </div>`));
}

// --------------------------------------------------------------- students
async function vStudents(body) {
  const [profiles, ents, coins] = await Promise.all([
    db.from('profiles').select('id,name,home_country,nationality,qualification_system,intake_year').order('created_at', { ascending: false }).limit(200),
    db.from('entitlements').select('student_id,plan,pass_term'),
    db.from('coin_ledger').select('student_id,delta'),
  ]);
  const ent = Object.fromEntries((ents.data ?? []).map((e) => [e.student_id, e]));
  const bal = {};
  for (const c of coins.data ?? []) bal[c.student_id] = (bal[c.student_id] ?? 0) + c.delta;
  body.innerHTML = '';
  const card = el(`<div class="card"><h2>Students</h2>
    <p class="sub">${(profiles.data ?? []).length} shown (newest first). Plan changes take effect in the student's app immediately.</p>
    <div class="scroll"><table><thead><tr><th>Name</th><th>From</th><th>Qualification</th><th>Intake</th><th>Plan</th><th>Coins</th><th>Grant plan</th></tr></thead>
    <tbody id="stb"></tbody></table></div></div>`);
  body.appendChild(card);
  const tb = card.querySelector('#stb');
  if (profiles.error || !(profiles.data ?? []).length) stateRow(tb, 7, profiles.error, 'No students yet.');
  for (const p of profiles.data ?? []) {
    const e = ent[p.id];
    const tr = el(`<tr><td><b>${esc(p.name)}</b></td><td>${esc(p.home_country ?? p.nationality ?? '')}</td>
      <td>${esc((p.qualification_system ?? '').toUpperCase())}</td><td>${esc(p.intake_year ?? '')}</td>
      <td>${e ? `<span class="pill ${e.plan === 'free' ? 'gray' : 'green'}">${esc(e.plan)}${e.pass_term ? ' · ' + esc(e.pass_term) : ''}</span>` : '<span class="pill gray">free</span>'}</td>
      <td>${bal[p.id] ?? 0}</td>
      <td><select><option value="">choose…</option><option value="free">free</option>
        <option value="season_pass:monthly">season pass · monthly</option>
        <option value="season_pass:lifetime">season pass · lifetime</option>
        <option value="vip">vip</option></select></td></tr>`);
    tr.querySelector('select').onchange = async (ev) => {
      const v = ev.target.value; if (!v) return;
      const [plan, term] = v.split(':');
      const { error } = await db.from('entitlements').upsert(
        { student_id: p.id, plan, pass_term: term ?? null, source: 'manual' }, { onConflict: 'student_id' });
      if (error) alert(error.message); else vStudents(body);
    };
    tb.appendChild(tr);
  }
}

// ------------------------------------------------------------ applications
async function vApplications(body) {
  const [apps, profiles] = await Promise.all([
    db.from('applications').select('id,student_id,course_id,status,intake,fee_waived,submitted_at').order('submitted_at', { ascending: false }).limit(200),
    db.from('profiles').select('id,name'),
  ]);
  const names = Object.fromEntries((profiles.data ?? []).map((p) => [p.id, p.name]));
  body.innerHTML = '';
  const card = el(`<div class="card"><h2>Applications</h2>
    <p class="sub">Changing the stage updates the student's tracker in the app.</p>
    <div class="scroll"><table><thead><tr><th>Student</th><th>Course</th><th>Intake</th><th>Submitted</th><th>Fee</th><th>Stage</th></tr></thead>
    <tbody id="atb"></tbody></table></div></div>`);
  body.appendChild(card);
  const tb = card.querySelector('#atb');
  if (apps.error || !(apps.data ?? []).length) stateRow(tb, 6, apps.error, 'No applications yet.');
  for (const a of apps.data ?? []) {
    const tr = el(`<tr><td><b>${esc(names[a.student_id] ?? '—')}</b></td><td>${esc(a.course_id)}</td>
      <td>${esc(a.intake ?? '')}</td><td>${esc((a.submitted_at ?? '').slice(0, 10))}</td>
      <td>${a.fee_waived ? '<span class="pill green">waived</span>' : ''}</td>
      <td><select>${STATUSES.map((s) => `<option ${s === a.status ? 'selected' : ''}>${s}</option>`).join('')}</select></td></tr>`);
    tr.querySelector('select').onchange = async (ev) => {
      const status = ev.target.value;
      const { error } = await db.from('applications').update({
        status, decision_at: new Date().toISOString(),
      }).eq('id', a.id);
      if (error) { alert(error.message); ev.target.value = a.status; }
    };
    tb.appendChild(tr);
  }
}

// ---------------------------------------------------------------- rewards
async function vRewards(body) {
  const [reds, profiles] = await Promise.all([
    db.from('redemptions').select('id,student_id,reward_item,coin_cost,redeemed_at,fulfilled').order('redeemed_at', { ascending: false }).limit(200),
    db.from('profiles').select('id,name'),
  ]);
  const names = Object.fromEntries((profiles.data ?? []).map((p) => [p.id, p.name]));
  body.innerHTML = '';
  const card = el(`<div class="card"><h2>Reward redemptions</h2>
    <p class="sub">Mark a voucher or event ticket fulfilled once you have delivered it to the student.</p>
    <div class="scroll"><table><thead><tr><th>Student</th><th>Item</th><th>Coins</th><th>Date</th><th>Status</th><th></th></tr></thead>
    <tbody id="rtb"></tbody></table></div></div>`);
  body.appendChild(card);
  const tb = card.querySelector('#rtb');
  if (reds.error || !(reds.data ?? []).length) stateRow(tb, 6, reds.error, 'No redemptions yet.');
  for (const r of reds.data ?? []) {
    const tr = el(`<tr><td><b>${esc(names[r.student_id] ?? '—')}</b></td><td>${esc(r.reward_item)}</td>
      <td>${r.coin_cost}</td><td>${esc((r.redeemed_at ?? '').slice(0, 10))}</td>
      <td>${r.fulfilled ? '<span class="pill green">fulfilled</span>' : '<span class="pill">pending</span>'}</td>
      <td>${r.fulfilled ? '' : '<button class="act">Mark fulfilled</button>'}</td></tr>`);
    const btn = tr.querySelector('button');
    if (btn) btn.onclick = async () => {
      const { error } = await db.from('redemptions').update({ fulfilled: true, fulfilled_at: new Date().toISOString() }).eq('id', r.id);
      if (error) alert(error.message); else vRewards(body);
    };
    tb.appendChild(tr);
  }
}

// -------------------------------------------------------------- community
const fmtDur = (s) => `${Math.floor((s ?? 0) / 60)}:${String((s ?? 0) % 60).padStart(2, '0')}`;
const fmtViews = (v) => (v >= 1000 ? `${(v / 1000).toFixed(1)}k` : String(v ?? 0));

async function vCommunity(body) {
  const [msgs, posts, shorts, ambs, grps] = await Promise.all([
    db.from('messages').select('id,group_id,sender_name,body,created_at').order('created_at', { ascending: false }).limit(500),
    db.from('ambassador_posts').select('id,ambassador_id,caption,media_urls,likes,posted_date').order('posted_date', { ascending: false }).limit(60),
    db.from('shorts').select('id,ambassador_id,title,video_url,thumbnail_url,duration_sec,view_count,is_reality_check').order('view_count', { ascending: false }).limit(60),
    db.from('ambassadors').select('id,name'),
    db.from('intake_groups').select('id,name,member_count'),
  ]);
  const names = Object.fromEntries((ambs.data ?? []).map((a) => [a.id, a.name]));
  body.innerHTML = '';

  // ---- group chats: one row per group, latest message as preview ----------
  const byGroup = {};
  for (const m of msgs.data ?? []) (byGroup[m.group_id] ??= []).push(m); // desc → [0] is latest
  const groupRows = (grps.data ?? [])
    .map((g) => ({ ...g, latest: byGroup[g.id]?.[0], count: byGroup[g.id]?.length ?? 0 }))
    .sort((a, b) => (b.latest?.created_at ?? '').localeCompare(a.latest?.created_at ?? ''));
  const card = el(`<div class="card"><h2>Group chats</h2>
    <p class="sub">One row per group, newest activity first — press a group to open its full conversation.</p>
    <div class="err">${msgs.error ? 'Could not load: ' + esc(msgs.error.message) : ''}</div>
    <div class="scroll"><table><thead><tr><th>Group</th><th>Members</th><th>Latest message</th><th>When</th><th>Msgs</th></tr></thead>
    <tbody id="gtb"></tbody></table></div></div>`);
  body.appendChild(card);
  const gtb = card.querySelector('#gtb');
  if (grps.error || !groupRows.length) stateRow(gtb, 5, grps.error, 'No groups yet.');
  for (const g of groupRows) {
    const tr = el(`<tr style="cursor:pointer">
      <td><b>${esc(g.name ?? g.id)}</b></td>
      <td>${g.member_count ?? 0}</td>
      <td>${g.latest ? `<b>${esc(g.latest.sender_name ?? '')}:</b> ${esc((g.latest.body ?? '').slice(0, 70))}` : '<span class="muted">No messages yet</span>'}</td>
      <td class="muted">${esc((g.latest?.created_at ?? '').replace('T', ' ').slice(0, 16))}</td>
      <td><span class="pill">${g.count}</span></td></tr>`);
    tr.onclick = () => renderGroupChat(body, g);
    gtb.appendChild(tr);
  }

  // ---- student posts: Photos | Videos sub-tabs ----------------------------
  const postsCard = el(`<div class="card"><h2>Student posts</h2>
    <p class="sub">Content shared in the community feed. Delete removes it for everyone.</p>
    <div style="display:flex;gap:6px;margin-bottom:12px">
      <button class="act primary" id="subPhotos">📷 Photos (${(posts.data ?? []).length})</button>
      <button class="act" id="subVideos">🎬 Videos (${(shorts.data ?? []).length})</button>
    </div>
    <div class="err">${posts.error ? 'Could not load: ' + esc(posts.error.message) : ''}${shorts.error ? ' Could not load videos: ' + esc(shorts.error.message) : ''}</div>
    <div id="postsGrid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px"></div>
    <div id="reelsGrid" style="display:none;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px"></div></div>`);
  body.appendChild(postsCard);
  const subP = postsCard.querySelector('#subPhotos');
  const subV = postsCard.querySelector('#subVideos');
  const pg = postsCard.querySelector('#postsGrid');
  const rg = postsCard.querySelector('#reelsGrid');
  const showSub = (which) => {
    pg.style.display = which === 'p' ? 'grid' : 'none';
    rg.style.display = which === 'v' ? 'grid' : 'none';
    subP.classList.toggle('primary', which === 'p');
    subV.classList.toggle('primary', which === 'v');
  };
  subP.onclick = () => showSub('p');
  subV.onclick = () => showSub('v');
  if (!(posts.data ?? []).length && !posts.error) pg.appendChild(el('<div class="muted">No posts yet.</div>'));
  for (const p of posts.data ?? []) {
    const img = (p.media_urls ?? [])[0];
    const cell = el(`<div style="border:1px solid var(--line);border-radius:10px;overflow:hidden">
      ${img ? `<img src="${esc(img)}" style="width:100%;height:120px;object-fit:cover" loading="lazy">`
            : '<div style="height:120px;background:var(--bg)" class="muted"></div>'}
      <div style="padding:8px">
        <div style="font-size:12px;height:34px;overflow:hidden">${esc((p.caption ?? '').slice(0, 90))}</div>
        <div class="muted" style="font-size:11px;margin:4px 0">${esc(names[p.ambassador_id] ?? '')} · ♥ ${p.likes ?? 0} · ${esc(p.posted_date ?? '')}</div>
        <button class="act danger" style="width:100%;padding:4px">Delete post</button>
      </div></div>`);
    cell.querySelector('button').onclick = async () => {
      if (!confirm('Delete this post (picture + caption) for everyone?')) return;
      const { error } = await db.from('ambassador_posts').delete().eq('id', p.id);
      if (error) alert(error.message); else cell.remove();
    };
    pg.appendChild(cell);
  }

  // ---- short reels (Videos sub-tab content) -------------------------------
  if (!(shorts.data ?? []).length && !shorts.error) rg.appendChild(el('<div class="muted">No reels yet.</div>'));
  for (const s of shorts.data ?? []) {
    const cell = el(`<div style="border:1px solid var(--line);border-radius:10px;overflow:hidden">
      <div style="position:relative;cursor:${s.video_url ? 'pointer' : 'default'}">
        ${s.thumbnail_url ? `<img src="${esc(s.thumbnail_url)}" style="width:100%;height:200px;object-fit:cover" loading="lazy">`
                          : '<div style="height:200px;background:#1a1a2e"></div>'}
        <span style="position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);font-size:30px;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.6)">▶</span>
        <span class="pill" style="position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.65);color:#fff">${fmtDur(s.duration_sec)}</span>
        ${s.is_reality_check ? '<span class="pill" style="position:absolute;left:6px;top:6px;background:#FEF0C7;color:#93370D">reality check</span>' : ''}
      </div>
      <div style="padding:8px">
        <div style="font-size:12px;font-weight:600;height:32px;overflow:hidden">${esc(s.title ?? '')}</div>
        <div class="muted" style="font-size:11px;margin:4px 0">${esc(names[s.ambassador_id] ?? '')} · ${fmtViews(s.view_count)} views</div>
        <button class="act danger" style="width:100%;padding:4px">Delete reel</button>
      </div></div>`);
    if (s.video_url) cell.querySelector('div').onclick = () => window.open(s.video_url, '_blank');
    cell.querySelector('button').onclick = async () => {
      if (!confirm('Delete this reel for everyone?')) return;
      const { error } = await db.from('shorts').delete().eq('id', s.id);
      if (error) alert(error.message); else cell.remove();
    };
    rg.appendChild(cell);
  }
}

/** Full conversation of one group — chat-app style drill-in. */
async function renderGroupChat(body, group) {
  const msgs = await db.from('messages').select('id,sender_name,body,created_at')
    .eq('group_id', group.id).order('created_at').limit(300);
  body.innerHTML = '';
  const card = el(`<div class="card">
    <button class="act" id="gback" style="margin-bottom:10px">← Back</button>
    <h2>${esc(group.name ?? group.id)}</h2>
    <p class="sub">${(msgs.data ?? []).length} messages · ${group.member_count ?? 0} members · delete removes a message for everyone.</p>
    <div class="err">${msgs.error ? 'Could not load: ' + esc(msgs.error.message) : ''}</div>
    <div class="scroll" style="max-height:62vh;overflow-y:auto"><table><thead><tr><th>When</th><th>Sender</th><th>Message</th><th></th></tr></thead>
    <tbody id="mtb"></tbody></table></div></div>`);
  body.appendChild(card);
  card.querySelector('#gback').onclick = () => vCommunity(body);
  const tb = card.querySelector('#mtb');
  if (!(msgs.data ?? []).length && !msgs.error) stateRow(tb, 4, null, 'No messages in this group yet.');
  for (const m of msgs.data ?? []) {
    const tr = el(`<tr><td class="muted" style="white-space:nowrap">${esc((m.created_at ?? '').replace('T', ' ').slice(0, 16))}</td>
      <td><b>${esc(m.sender_name ?? '')}</b></td>
      <td>${esc(m.body ?? '')}</td>
      <td><button class="act danger">Delete</button></td></tr>`);
    tr.querySelector('button').onclick = async () => {
      if (!confirm('Delete this message for everyone?')) return;
      const { error } = await db.from('messages').delete().eq('id', m.id);
      if (error) alert(error.message); else tr.remove();
    };
    tb.appendChild(tr);
  }
}

// ---------------------------------------------------------------- catalog
const COUNTRIES = ['AU','MY','TW','GB','SG','NZ','RU','US','CA','CN'];
const TYPES = ['university','college','institute'];
const flag = (cc) => /^[A-Z]{2}$/.test(cc ?? '') ? String.fromCodePoint(...[...cc].map((c) => 127397 + c.charCodeAt(0))) : '';
const slugId = (country, name) =>
  `${(country || 'xx').toLowerCase()}-${(name || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '').slice(0, 48)}`;

const EMPTY_FILTER = { q: '', cc: '', type: '', ver: '', ph: '', rk: '', open: false };
async function vCatalog(body, filter = { ...EMPTY_FILTER }) {
  const insts = await db.from('institutions')
    .select('id,name,short_name,type,country,city,is_verified_partner,tagline,website,founded,students,qs_rank,logo,photos')
    .order('name').limit(300);
  body.innerHTML = '';
  const all = insts.data ?? [];
  const shown = all.filter((i) =>
    (!filter.cc || i.country === filter.cc) &&
    (!filter.type || i.type === filter.type) &&
    (!filter.ver || (filter.ver === 'yes') === Boolean(i.is_verified_partner)) &&
    (!filter.ph || (filter.ph === 'with') === ((i.photos ?? []).length > 0)) &&
    (!filter.rk || (filter.rk === 'ranked') === (i.qs_rank != null)) &&
    (!filter.q || `${i.name} ${i.city}`.toLowerCase().includes(filter.q.toLowerCase())));
  const nActive = ['type', 'ver', 'ph', 'rk'].filter((k) => filter[k]).length;
  const filtered = filter.q || filter.cc || nActive > 0;
  const card = el(`<div class="card"><h2>Institutions (${shown.length}${filtered ? ` of ${all.length}` : ''})</h2>
    <p class="sub">Everything here edits the live catalog. Never mark a partner verified without a signed agreement.</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">
      <input id="cq" placeholder="Search name or city…" value="${esc(filter.q)}" style="flex:1;min-width:180px">
      <select id="ccc"><option value="">All countries</option>
        ${COUNTRIES.map((c) => `<option value="${c}" ${filter.cc === c ? 'selected' : ''}>${flag(c)} ${c}</option>`).join('')}</select>
      <button class="act${nActive ? ' primary' : ''}" id="cfilters">Filters${nActive ? ' · ' + nActive : ''}</button>
      <button class="act primary" id="addInst">+ Add institution</button>
    </div>
    ${filter.open ? `<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg)">
      <select id="ftype"><option value="">All types</option>
        ${TYPES.map((t) => `<option value="${t}" ${filter.type === t ? 'selected' : ''}>${t}</option>`).join('')}</select>
      <select id="fver"><option value="">Verified: all</option>
        <option value="yes" ${filter.ver === 'yes' ? 'selected' : ''}>Verified partners only</option>
        <option value="no" ${filter.ver === 'no' ? 'selected' : ''}>Not verified</option></select>
      <select id="fph"><option value="">Photos: all</option>
        <option value="with" ${filter.ph === 'with' ? 'selected' : ''}>With photos</option>
        <option value="without" ${filter.ph === 'without' ? 'selected' : ''}>No photos</option></select>
      <select id="frk"><option value="">Rank: all</option>
        <option value="ranked" ${filter.rk === 'ranked' ? 'selected' : ''}>World-ranked</option>
        <option value="unranked" ${filter.rk === 'unranked' ? 'selected' : ''}>Unranked</option></select>
      <button class="act" id="fclear">Clear filters</button>
    </div>` : ''}
    <div class="scroll"><table><thead><tr>
      <th></th><th>Name</th><th>Where</th><th>Type</th><th>Rank</th><th>Verified</th><th>Photos</th><th style="text-align:right">Actions</th>
    </tr></thead><tbody id="ctb"></tbody></table></div></div>`);
  body.appendChild(card);
  card.querySelector('#cq').onchange = (ev) => vCatalog(body, { ...filter, q: ev.target.value });
  card.querySelector('#ccc').onchange = (ev) => vCatalog(body, { ...filter, cc: ev.target.value });
  card.querySelector('#cfilters').onclick = () => vCatalog(body, { ...filter, open: !filter.open });
  if (filter.open) {
    card.querySelector('#ftype').onchange = (ev) => vCatalog(body, { ...filter, type: ev.target.value });
    card.querySelector('#fver').onchange = (ev) => vCatalog(body, { ...filter, ver: ev.target.value });
    card.querySelector('#fph').onchange = (ev) => vCatalog(body, { ...filter, ph: ev.target.value });
    card.querySelector('#frk').onchange = (ev) => vCatalog(body, { ...filter, rk: ev.target.value });
    card.querySelector('#fclear').onclick = () => vCatalog(body, { ...EMPTY_FILTER, q: filter.q, cc: filter.cc, open: true });
  }
  card.querySelector('#addInst').onclick = () => renderInstForm(body, null, filter);
  const tb = card.querySelector('#ctb');
  if (insts.error || !shown.length) stateRow(tb, 8, insts.error, 'No institutions match.');
  for (const i of shown) {
    const tr = el(`<tr>
      <td>${i.logo ? `<img src="${esc(i.logo)}" style="width:22px;height:22px;border-radius:4px;object-fit:contain" onerror="this.style.display='none'">` : ''}</td>
      <td><b>${esc(i.name)}</b>${i.short_name ? ` <span class="muted">· ${esc(i.short_name)}</span>` : ''}</td>
      <td>${flag(i.country)} ${esc(i.city)}, ${esc(i.country)}</td>
      <td>${esc(i.type ?? '')}</td>
      <td>${i.qs_rank ?? '<span class="muted">—</span>'}</td>
      <td><input type="checkbox" ${i.is_verified_partner ? 'checked' : ''}></td>
      <td>${(i.photos ?? []).length}</td>
      <td style="text-align:right;white-space:nowrap">
        <button class="act" data-a="edit">Edit</button>
        <button class="act danger" data-a="del">Delete</button>
      </td></tr>`);
    tr.querySelector('input[type=checkbox]').onchange = async (ev) => {
      const { error } = await db.from('institutions').update({ is_verified_partner: ev.target.checked }).eq('id', i.id);
      if (error) { alert(error.message); ev.target.checked = !ev.target.checked; }
    };
    tr.querySelector('[data-a=edit]').onclick = () => renderInstForm(body, i, filter);
    tr.querySelector('[data-a=del]').onclick = async () => {
      if (!confirm(`Delete "${i.name}" and ALL its courses? Students' applications pointing at its courses will block this — that is intentional.`)) return;
      const { error } = await db.from('institutions').delete().eq('id', i.id);
      if (error) alert('Could not delete: ' + error.message);
      else vCatalog(body, filter);
    };
    tb.appendChild(tr);
  }
}

async function uploadMedia(instId, file) {
  const path = `${instId}/${Date.now()}-${file.name.replace(/[^\w.-]+/g, '_')}`;
  const up = await db.storage.from('institution-media').upload(path, file, { upsert: false });
  if (up.error) throw new Error(up.error.message);
  return db.storage.from('institution-media').getPublicUrl(path).data.publicUrl;
}

function renderInstForm(body, inst, filter) {
  const isNew = !inst;
  const f = inst ?? { country: 'MY', type: 'university', photos: [] };
  const photos = f.photos ?? [];
  body.innerHTML = '';
  const card = el(`<div class="card" style="max-width:720px">
    <button class="act" id="fback" style="margin-bottom:10px">← Back</button>
    <h2>${isNew ? 'Add institution' : 'Edit — ' + esc(f.name)}</h2>
    <div class="err" id="ferr"></div>
    <table><tbody>
      <tr><td class="muted">Name</td><td><input id="f_name" value="${esc(f.name ?? '')}" style="width:100%"></td></tr>
      <tr><td class="muted">Short name</td><td><input id="f_short" value="${esc(f.short_name ?? '')}" style="width:100%"></td></tr>
      <tr><td class="muted">Type</td><td><select id="f_type" style="width:100%">
        ${TYPES.map((t) => `<option ${f.type === t ? 'selected' : ''}>${t}</option>`).join('')}</select></td></tr>
      <tr><td class="muted">Country</td><td><select id="f_cc" style="width:100%">
        ${COUNTRIES.map((c) => `<option value="${c}" ${f.country === c ? 'selected' : ''}>${flag(c)} ${c}</option>`).join('')}</select></td></tr>
      <tr><td class="muted">City</td><td><input id="f_city" value="${esc(f.city ?? '')}" style="width:100%"></td></tr>
      <tr><td class="muted">Tagline</td><td><input id="f_tag" value="${esc(f.tagline ?? '')}" style="width:100%"></td></tr>
      <tr><td class="muted">Website</td><td><input id="f_web" value="${esc(f.website ?? '')}" style="width:100%"></td></tr>
      <tr><td class="muted">Logo</td><td><div style="display:flex;gap:8px;align-items:center">
        <img id="f_logo_prev" src="${esc(f.logo ?? '')}" style="width:36px;height:36px;border-radius:6px;object-fit:contain;border:1px solid var(--line);${f.logo ? '' : 'display:none'}" onerror="this.style.display='none'">
        <input id="f_logo" value="${esc(f.logo ?? '')}" style="flex:1" placeholder="Logo image URL">
        ${isNew ? '' : '<input type="file" id="f_logo_file" accept="image/*" style="display:none"><button class="act" id="f_logo_up">Upload</button>'}
      </div></td></tr>
      <tr><td class="muted">Founded</td><td><input id="f_founded" type="number" value="${esc(f.founded ?? '')}" style="width:100%"></td></tr>
      <tr><td class="muted">Students</td><td><input id="f_students" type="number" value="${esc(f.students ?? '')}" style="width:100%"></td></tr>
      <tr><td class="muted">World rank</td><td><input id="f_rank" type="number" value="${esc(f.qs_rank ?? '')}" style="width:100%"></td></tr>
    </tbody></table>
    <div style="display:flex;gap:8px;margin-top:12px">
      <button class="act primary" id="fsave">${isNew ? 'Create' : 'Save changes'}</button>
      <button class="act" id="fcancel">${isNew ? 'Cancel' : 'Back to catalog'}</button>
    </div>
    ${isNew ? '<p class="note" style="margin-top:8px">Create the school first — the photo sections open right after.</p>' : ''}
  </div>`);
  body.appendChild(card);

  const refresh = async () => {
    const { data, error } = await db.from('institutions').select('*').eq('id', inst.id).single();
    if (error) { alert(error.message); return; }
    renderInstForm(body, data, filter);
  };
  const setPhotos = async (next) => {
    const { error } = await db.from('institutions').update({ photos: next }).eq('id', inst.id);
    if (error) alert(error.message); else refresh();
  };

  // Live logo preview + optional upload straight into the media storage.
  const logoInput = card.querySelector('#f_logo');
  const logoPrev = card.querySelector('#f_logo_prev');
  logoInput.oninput = () => {
    logoPrev.src = logoInput.value.trim();
    logoPrev.style.display = logoInput.value.trim() ? '' : 'none';
  };
  if (!isNew) {
    const logoFile = card.querySelector('#f_logo_file');
    card.querySelector('#f_logo_up').onclick = () => logoFile.click();
    logoFile.onchange = async () => {
      if (!logoFile.files[0]) return;
      try {
        logoInput.value = await uploadMedia(inst.id, logoFile.files[0]);
        logoInput.oninput();
        card.querySelector('#ferr').textContent = 'Logo uploaded — press "Save changes" to keep it.';
      } catch (e) { card.querySelector('#ferr').textContent = e.message; }
    };
  }

  card.querySelector('#fback').onclick = () => vCatalog(body, filter);
  card.querySelector('#fcancel').onclick = () => vCatalog(body, filter);
  card.querySelector('#fsave').onclick = async () => {
    const val = (id) => card.querySelector(id).value.trim();
    const num = (id) => (val(id) === '' ? null : Number(val(id)));
    const row = {
      name: val('#f_name'), short_name: val('#f_short') || val('#f_name'),
      type: card.querySelector('#f_type').value, country: card.querySelector('#f_cc').value,
      city: val('#f_city'), tagline: val('#f_tag'), website: val('#f_web'), logo: val('#f_logo'),
      founded: num('#f_founded'), students: num('#f_students'), qs_rank: num('#f_rank'),
    };
    if (!row.name || !row.city) { card.querySelector('#ferr').textContent = 'Name and city are required.'; return; }
    if (isNew) {
      const { data, error } = await db.from('institutions')
        .insert({ id: slugId(row.country, row.name), ...row }).select().single();
      if (error) { card.querySelector('#ferr').textContent = error.message; return; }
      renderInstForm(body, data, filter); // straight into photo management
    } else {
      const { error } = await db.from('institutions').update(row).eq('id', inst.id);
      if (error) { card.querySelector('#ferr').textContent = error.message; return; }
      vCatalog(body, filter);
    }
  };

  if (isNew) return;

  // ---- Pictures: MAIN (hero) photo separated from the rest ----------------
  const media = el(`<div class="card" style="max-width:720px">
    <h2>Pictures</h2>
    <p class="sub">The MAIN photo is what students see first on the school page — it must clearly show the campus. Changes here save immediately.</p>
    <div class="err" id="perr"></div>
    <h2 style="font-size:13px;color:var(--faint)">MAIN PHOTO (profile picture)</h2>
    <div id="heroBox" style="margin-bottom:14px"></div>
    <h2 style="font-size:13px;color:var(--faint)">OTHER PHOTOS</h2>
    <div id="pgrid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:12px"></div>
    <div style="display:flex;gap:8px;align-items:center">
      <input type="file" id="pfile" accept="image/*">
      <button class="act primary" id="pup">Add photo</button>
    </div></div>`);
  body.appendChild(media);
  const heroBox = media.querySelector('#heroBox');
  if (photos.length) {
    const hero = el(`<div style="position:relative;max-width:460px">
      <img src="${esc(photos[0])}" style="width:100%;height:230px;object-fit:cover;border-radius:10px;border:1px solid var(--line)">
      <span class="pill green" style="position:absolute;left:8px;top:8px">main</span>
      <button class="act danger" style="position:absolute;right:8px;top:8px;padding:2px 9px">✕</button></div>`);
    hero.querySelector('button').onclick = () => {
      if (confirm('Remove the main photo? The next photo becomes the new main.')) setPhotos(photos.slice(1));
    };
    heroBox.appendChild(hero);
  } else {
    heroBox.appendChild(el('<div class="muted">No main photo yet — the first photo you add becomes it.</div>'));
  }
  const grid = media.querySelector('#pgrid');
  if (photos.length <= 1) grid.appendChild(el('<div class="muted">No other photos yet.</div>'));
  photos.slice(1).forEach((url, j) => {
    const idx = j + 1;
    const cell = el(`<div style="position:relative">
      <img src="${esc(url)}" style="width:100%;height:100px;object-fit:cover;border-radius:8px;border:1px solid var(--line)">
      <div style="display:flex;gap:4px;margin-top:4px">
        <button class="act" style="flex:1;padding:3px 6px;font-size:11px">Make main</button>
        <button class="act danger" style="padding:3px 8px;font-size:11px">✕</button>
      </div></div>`);
    const [mkMain, rm] = cell.querySelectorAll('button');
    mkMain.onclick = () => setPhotos([url, ...photos.filter((_, k) => k !== idx)]);
    rm.onclick = () => { if (confirm('Remove this photo?')) setPhotos(photos.filter((_, k) => k !== idx)); };
    grid.appendChild(cell);
  });
  media.querySelector('#pup').onclick = async () => {
    const file = media.querySelector('#pfile').files[0];
    if (!file) { media.querySelector('#perr').textContent = 'Choose an image file first.'; return; }
    media.querySelector('#perr').textContent = '';
    try {
      const url = await uploadMedia(inst.id, file);
      await setPhotos([...photos, url]);
    } catch (e) { media.querySelector('#perr').textContent = e.message; }
  };
}

boot();
db.auth.onAuthStateChange((event) => { if (event === 'SIGNED_IN' && !location.hash.includes('type=')) boot(); });
</script>
