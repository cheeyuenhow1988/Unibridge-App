# Deploys and VERIFIES the complete UniBridge backend on the connected
# Supabase project — schema, security rules, all catalog data, the
# sync-entitlement edge function, and a live two-student security test.
#
# Needs exactly ONE repository secret (Settings → Secrets and variables →
# Actions → New repository secret):
#   SUPABASE_ACCESS_TOKEN   personal token (sbp_…) from
#                           supabase.com/dashboard/account/tokens
#
# Optional secret SUPABASE_PROJECT_REF picks a specific project when the
# account has several. Until the token exists the workflow runs green and
# just says what is missing. Everything happens over the Supabase
# Management API — no database password required. See scripts/deploy-backend.mjs.
name: supabase-deploy
on:
  workflow_dispatch:
  push:
    branches: [claude/unibridge-app-prototype-11m67q]
    paths: ['supabase/**', 'scripts/deploy-backend.mjs', 'scripts/sql-split.mjs', '.github/workflows/supabase-deploy.yml']
permissions: {}
concurrency: supabase-deploy
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install supabase-js (for the live realtime check)
        run: npm install --no-save --no-audit --no-fund @supabase/supabase-js
      - name: Deploy + verify backend
        run: node scripts/deploy-backend.mjs
