# Applies the UniBridge backend to the connected Supabase project:
# migrations 0001–0008 (schema + RLS + catalog data) and the
# sync-entitlement edge function.
#
# It needs three repository secrets (Settings → Secrets and variables →
# Actions → New repository secret) — see supabase/README.md for where each
# value lives in the Supabase dashboard:
#   SUPABASE_ACCESS_TOKEN   personal token from supabase.com/dashboard/account/tokens
#   SUPABASE_PROJECT_REF    Project Settings → General → Reference ID
#   SUPABASE_DB_PASSWORD    the database password chosen at project creation
#
# Until those exist the workflow runs green and just prints what is missing,
# so it is always safe. Once they exist it deploys on every push that
# touches supabase/**, and can be run manually from the Actions tab.
name: supabase-deploy
on:
  workflow_dispatch:
  push:
    branches: [claude/unibridge-app-prototype-11m67q]
    paths: ['supabase/**']
permissions: {}
concurrency: supabase-deploy
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Check credentials
        id: creds
        run: |
          missing=""
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -z "$SUPABASE_PROJECT_REF" ] && missing="$missing SUPABASE_PROJECT_REF"
          [ -z "$SUPABASE_DB_PASSWORD" ] && missing="$missing SUPABASE_DB_PASSWORD"
          if [ -n "$missing" ]; then
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "Not deploying — missing repository secret(s):$missing"
            echo "Add them under Settings → Secrets and variables → Actions, then re-run."
            echo "Where each value lives: see supabase/README.md ('Deploy via GitHub')."
          else
            echo "have=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.creds.outputs.have == 'true'
      - uses: supabase/setup-cli@v1
        if: steps.creds.outputs.have == 'true'
        with:
          version: latest
      - name: Link project
        if: steps.creds.outputs.have == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Push schema + catalog data (migrations 0001-0008)
        if: steps.creds.outputs.have == 'true'
        run: supabase db push
      - name: Deploy sync-entitlement edge function
        if: steps.creds.outputs.have == 'true'
        run: supabase functions deploy sync-entitlement
      - name: Ensure entitlement webhook secret exists
        if: steps.creds.outputs.have == 'true'
        run: |
          if ! supabase secrets list | grep -q ENTITLEMENT_WEBHOOK_SECRET; then
            supabase secrets set ENTITLEMENT_WEBHOOK_SECRET="$(openssl rand -hex 24)"
            echo "Generated a fresh ENTITLEMENT_WEBHOOK_SECRET (stored only in Supabase)."
          else
            echo "ENTITLEMENT_WEBHOOK_SECRET already set — leaving it alone."
          fi
