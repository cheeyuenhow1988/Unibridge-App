# Deploys and VERIFIES the complete UniBridge backend on the connected
# Supabase project — schema, security rules, all catalog data, the
# sync-entitlement edge function, and a live two-student security test —
# then builds the web app in live-backend mode and publishes it to
# GitHub Pages under /live (the root demo stays untouched).
#
# Needs exactly ONE repository secret (Settings → Secrets and variables →
# Actions → New repository secret):
#   SUPABASE_ACCESS_TOKEN   personal token (sbp_…) from
#                           supabase.com/dashboard/account/tokens
#
# Optional secret SUPABASE_PROJECT_REF picks a specific project when the
# account has several. Until the token exists the workflow runs green and
# just says what is missing. Everything happens over the Supabase
# Management API — no database password required. See scripts/deploy-backend.mjs.
name: supabase-deploy
on:
  workflow_dispatch:
    inputs:
      admin_email:
        description: 'Email to invite as back-office admin (optional)'
        required: false
      qa_screens:
        description: 'Run the full back-office browser trial and save screenshots (may show student data — artifact kept 1 day)'
        required: false
        default: 'false'
      test_invite_email:
        description: 'Send a deliverability-test invitation to this address (use your own inbox, e.g. a +invitetest Gmail alias); the test auth user is swept on the next run'
        required: false
  push:
    branches: [claude/unibridge-app-prototype-11m67q]
    paths: ['supabase/**', 'admin/**', 'scripts/deploy-backend.mjs', 'scripts/sql-split.mjs', '.github/workflows/supabase-deploy.yml']
permissions: {}
concurrency: supabase-deploy
jobs:
  deploy:
    runs-on: ubuntu-latest
    outputs:
      deployed: ${{ steps.run.outputs.deployed }}
      supabase_url: ${{ steps.run.outputs.supabase_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install supabase-js (for the live realtime check)
        run: npm install --no-save --no-audit --no-fund @supabase/supabase-js
      - name: Deploy + verify backend
        id: run
        env:
          # Scoped to this step only — no other step sees the token.
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          ADMIN_EMAIL: ${{ inputs.admin_email }}
          TEST_INVITE_EMAIL: ${{ inputs.test_invite_email }}
        run: node scripts/deploy-backend.mjs
      # The publishable key is public by design, but GitHub blocks key-shaped
      # job outputs — hand it to the build job as an artifact file instead.
      - uses: actions/upload-artifact@v4
        if: steps.run.outputs.deployed == 'true'
        with:
          name: live-config
          path: live-config.env
          retention-days: 1
      - name: Install Playwright (back-office trial)
        if: inputs.qa_screens == 'true' && steps.run.outputs.deployed == 'true'
        run: |
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
      - name: Full back-office browser trial
        if: inputs.qa_screens == 'true' && steps.run.outputs.deployed == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: node scripts/test-admin-e2e.mjs
      - uses: actions/upload-artifact@v4
        if: always() && inputs.qa_screens == 'true'
        with:
          name: backoffice-qa-screenshots
          path: qa-screenshots/
          retention-days: 1

  # Once the backend is live, build the app against it and publish under
  # /live on GitHub Pages. Uses only PUBLIC values from the deploy job
  # (project URL + publishable key — they ship inside the app bundle).
  publish-live-app:
    needs: deploy
    if: needs.deploy.outputs.deployed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: live-config
      - name: Build web app in live-backend mode
        run: |
          node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('app.json','utf8'));(j.expo.experiments??={}).baseUrl='/Unibridge-App/live';fs.writeFileSync('app.json',JSON.stringify(j,null,2));"
          set -a && source live-config.env && set +a
          npx expo export --platform web
      - name: Publish app under /live and back office under /admin
        run: |
          node -e "
            const fs = require('fs');
            const env = Object.fromEntries(fs.readFileSync('live-config.env','utf8').trim().split('\n').map((l) => l.split(/=(.*)/s).slice(0, 2)));
            fs.writeFileSync('admin/config.js', 'window.UB_CONFIG = ' + JSON.stringify({ url: env.EXPO_PUBLIC_SUPABASE_URL, anonKey: env.EXPO_PUBLIC_SUPABASE_ANON_KEY }) + ';');
          "
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages
          git worktree add /tmp/ghp origin/gh-pages
          rm -rf /tmp/ghp/live /tmp/ghp/admin
          mkdir -p /tmp/ghp/live /tmp/ghp/admin
          cp -r dist/* /tmp/ghp/live/
          cp -r admin/* /tmp/ghp/admin/
          cd /tmp/ghp
          git add -A
          git commit -m "deploy live-backend app under /live + back office under /admin" || echo "unchanged"
          git push origin HEAD:gh-pages
